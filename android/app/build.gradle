plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader("UTF-8") { reader -> localProperties.load(reader) }
}

def flutterVersionCode = localProperties.getProperty("flutter.versionCode") ?: "1"
def flutterVersionName = localProperties.getProperty("flutter.versionName") ?: "1.0.0"

// Optional release signing: create android/key.properties (never committed) with
//   storeFile=../keystore/stego-vault.jks
//   storePassword=…
//   keyAlias=stego-vault
//   keyPassword=…
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "com.obsidian.stegovault"
    compileSdk = 34
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        applicationId = "com.obsidian.stegovault"
        minSdk = 24
        targetSdk = 34
        versionCode = flutterVersionCode.toInteger()
        versionName = flutterVersionName

        // ARM64 / v8a optimised release build target.
        ndk {
            abiFilters "arm64-v8a"
        }
    }

    signingConfigs {
        if (keystoreProperties.containsKey("storeFile")) {
            release {
                keyAlias = keystoreProperties["keyAlias"]
                keyPassword = keystoreProperties["keyPassword"]
                storeFile = file(keystoreProperties["storeFile"])
                storePassword = keystoreProperties["storePassword"]
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix = ".debug"
            versionNameSuffix = "-debug"
        }
        release {
            // Falls back to the debug key when no keystore is configured so that
            // `flutter build apk --release` works out of the box.
            signingConfig = keystoreProperties.containsKey("storeFile")
                    ? signingConfigs.release
                    : signingConfigs.debug

            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            ndk {
                debugSymbolLevel = "NONE"
            }
        }
    }

    // Optional per-ABI APKs: `flutter build apk --split-per-abi`
    splits {
        abi {
            enable = false
            reset()
            include "arm64-v8a", "armeabi-v7a"
            universalApk = false
        }
    }

    packagingOptions {
        resources {
            excludes += ["META-INF/*.kotlin_module", "META-INF/DEPENDENCIES"]
        }
    }

    buildFeatures {
        buildConfig = true
    }

    lint {
        checkReleaseBuilds = false
        abortOnError = false
    }
}

flutter {
    source = "../.."
}

dependencies {
    // Native EXIF verification bridge (see MainActivity.kt).
    implementation "androidx.exifinterface:exifinterface:1.3.7"
}
